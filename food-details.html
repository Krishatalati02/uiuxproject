<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Food Details | Meal Bridge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
    }

    .detail-card {
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
    }

    .info-box {
      background: #f1f3f5;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand text-success fw-bold fs-3" href="#">Meal <span class="text-danger">Bridge</span></a>
  </div>
</nav>

<section class="container pt-5 mt-5">

  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="detail-card">

        <!-- Title -->
        <h3 class="fw-bold mb-2">Veg Biryani</h3>
        <span class="badge bg-warning text-dark">Leftover</span>

        <!-- Info -->
        <div class="row mt-4 g-3">

          <div class="col-md-6">
            <div class="info-box">
              <i class="bi bi-box"></i> Quantity: 2 Plates
            </div>
          </div>

          <div class="col-md-6">
            <div class="info-box">
              <i class="bi bi-clock"></i> Expires: Today 9 PM
            </div>
          </div>

          <div class="col-md-6">
            <div class="info-box">
              <i class="bi bi-geo-alt"></i> Location: Ahmedabad
            </div>
          </div>

          <div class="col-md-6">
            <div class="info-box">
              <i class="bi bi-person"></i> Donor: Individual
            </div>
          </div>

        </div>

        <!-- Description -->
        <div class="mt-4">
          <h5>Description</h5>
          <p class="text-muted">
            Fresh homemade veg biryani prepared today. Properly stored and hygienic.
            Suitable for immediate consumption.
          </p>
        </div>

        <!-- Contact -->
        <div class="mt-3">
          <h6>Contact</h6>
          <p class="text-muted mb-1"><i class="bi bi-telephone"></i> +91 98765 43210</p>
          <p class="text-muted"><i class="bi bi-envelope"></i> donor@email.com</p>
        </div>

        <!-- Buttons -->
        <div class="d-flex gap-3 mt-4">
          <button class="btn btn-success flex-fill">
            <i class="bi bi-check-circle"></i> Claim Food
          </button>

          <button class="btn btn-outline-secondary flex-fill" onclick="history.back()">
            Go Back
          </button>
        </div>

      </div>

    </div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
