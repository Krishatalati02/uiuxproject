<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Available Foods | Meal Bridge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body { background: linear-gradient(to bottom, #f8f9fa, #e9ecef); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar { background: rgba(0,0,0,0.15); backdrop-filter: blur(8px); }
    .food-card { transition: all 0.25s ease; border: none; border-radius: 1rem; overflow: hidden; background: #fff; }
    .food-card:hover { transform: translateY(-6px); box-shadow: 0 12px 25px rgba(0,0,0,0.15) !important; }
    .food-card img { height: 180px; object-fit: cover; filter: brightness(0.95); }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand text-success fw-bold fs-3" href="#">Meal <span class="text-danger">Bridge</span></a>
  </div>
</nav>

<section class="container my-5 pt-5">

  <h4 class="mb-4 fw-bold text-success">Individual Leftover Food</h4>

  <div class="row mb-4 g-3">
    <div class="col-md-4"><input class="form-control" placeholder="Search food..." /></div>
    <div class="col-md-4"><select class="form-select"><option>Sort by Expiry</option></select></div>
    <div class="col-md-4"><select class="form-select"><option>All Foods</option></select></div>
  </div>

  <div class="row g-4">

    <div class="col-md-6 col-lg-4">
      <div class="card food-card h-100 shadow-sm">
        <img src="veg5.jpg" class="card-img-top">
        <div class="card-body d-flex flex-column p-3">
          <h5><span class="badge bg-warning text-dark">Leftover</span><br>Veg Biryani</h5>
          <p class="text-muted small">Qty: 2 plates | Expires: Today 9 PM</p>
          <div class="mt-auto d-flex gap-2">
            <button class="btn btn-outline-success flex-fill">Claim</button>
            <button class="btn btn-outline-secondary flex-fill">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-4">
      <div class="card food-card h-100 shadow-sm">
        <img src="veg1.jpg" class="card-img-top">
        <div class="card-body d-flex flex-column p-3">
          <h5><span class="badge bg-warning text-dark">Leftover</span><br>Chapati & Dal</h5>
          <p class="text-muted small">Qty: 5 chapatis | Expires: Today 8 PM</p>
          <div class="mt-auto d-flex gap-2">
            <button class="btn btn-outline-success flex-fill">Claim</button>
            <button class="btn btn-outline-secondary flex-fill">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-4">
      <div class="card food-card h-100 shadow-sm">
        <img src="veg2.jpg" class="card-img-top">
        <div class="card-body d-flex flex-column p-3">
          <h5>
            <span class="badge bg-success">CLAIMED</span><br>
            Aloo Paratha<br>
            <small class="text-success">by NGO Volunteer</small>
          </h5>
          <p class="text-muted small">Qty: 3 plates | Expires: Tomorrow 10 AM</p>
          <button class="btn btn-outline-secondary mt-auto">View Details</button>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
