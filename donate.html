<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donate Food | Meal Bridge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {background: linear-gradient(135deg, #f9fbe7, #e9f8ee); min-height: 100vh;}
    .navbar {background: rgba(56,179,113,0.13); backdrop-filter: blur(12px);}
    .donate-form{background:#fff;border-radius:1.2rem;padding:2.5rem;
                 box-shadow:0 6px 20px rgba(0,0,0,.1);}
    .btn-donate{background:linear-gradient(135deg,#dc3545,#c82333);border:none;color:white;}
    .btn-donate:hover{background:linear-gradient(135deg,#c82333,#a71d2a);}
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand text-success fw-bold fs-3" href="dashboard.html">
      Meal <span class="text-danger">Bridge</span>
    </a>
  </div>
</nav>

<div class="container" style="margin-top:120px; max-width:600px;">

  <div class="donate-form">
    <h3 class="text-center text-danger mb-4">Donate Your Food</h3>

    <form>

      <div class="mb-3">
        <label class="form-label">Food Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Quantity (servings) <span class="text-danger">*</span></label>
        <input type="number" class="form-control" min="1" max="500" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Best Before <span class="text-danger">*</span></label>
        <input type="datetime-local" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Pickup Location <span class="text-danger">*</span></label>
        <input type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact Number <span class="text-danger">*</span></label>
        <input type="tel" class="form-control" placeholder="+919876543210" required>
        <small class="text-muted">For pickup coordination</small>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="2"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Food Photo (optional)</label>
        <input type="file" class="form-control">
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="bulk">
        <label class="form-check-label" for="bulk">
          <strong>Bulk Donation</strong> (10+ servings)
        </label>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-donate flex-fill py-2 fw-bold">List My Donation</button>
        <a href="dashboard.html" class="btn btn-outline-secondary flex-fill py-2">Cancel</a>
      </div>

    </form>
  </div>

</div>

<script>
  const exp = document.querySelector('input[type="datetime-local"]');
  if (exp) {
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    exp.min = now.toISOString().slice(0,16);
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
