<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coordinate Pickup | Meal Bridge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      background: linear-gradient(to bottom, #f8f9fa, #e9ecef);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
    }

    .form-card {
      background: #fff;
      border-radius: 1rem;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      border: 2px solid #ffc107;
    }

    .highlight-box {
      background: #fff3cd;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand text-success fw-bold fs-3" href="#">Meal <span class="text-danger">Bridge</span></a>
  </div>
</nav>

<section class="container pt-5 mt-5">

  <div class="row justify-content-center">
    <div class="col-lg-7">

      <div class="form-card">

        <!-- Title -->
        <h3 class="fw-bold mb-2">Coordinate Pickup</h3>
        <span class="badge bg-warning text-dark">Bulk Food Rescue</span>

        <!-- Info -->
        <div class="highlight-box mt-3">
          <i class="bi bi-info-circle"></i>
          You are coordinating pickup for a bulk food donation (serves 100+ people).
        </div>

        <!-- Form -->
        <form class="mt-4">

          <div class="mb-3">
            <label class="form-label">NGO / Organization Name</label>
            <input type="text" class="form-control" placeholder="Enter organization name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Contact Person</label>
            <input type="text" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Pickup Time</label>
            <input type="time" class="form-control" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Vehicle Type</label>
            <select class="form-select">
              <option>Small Vehicle</option>
              <option>Van</option>
              <option>Truck</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Additional Notes</label>
            <textarea class="form-control" rows="3" placeholder="Any special instructions..."></textarea>
          </div>

          <!-- Buttons -->
          <div class="d-flex gap-3 mt-4">
            <button type="submit" class="btn btn-warning flex-fill">
              <i class="bi bi-check-circle"></i> Confirm Coordination
            </button>

            <button type="button" class="btn btn-outline-secondary flex-fill" onclick="history.back()">
              Cancel
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Simple success alert (frontend only)
  document.querySelector("form").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Pickup Coordinated Successfully!");
  });
</script>

</body>
</html>
