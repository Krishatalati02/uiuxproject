<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulk Food Rescue | Meal Bridge</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body { background: linear-gradient(to bottom, #f8f9fa, #e9ecef); min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar { background: rgba(0,0,0,0.15); backdrop-filter: blur(8px); }
    .bulk-card { transition: all 0.25s ease; border-radius: 1rem; border: 2px solid #ffc107; overflow: hidden; background: #fff; }
    .bulk-card:hover { transform: translateY(-6px); box-shadow: 0 12px 25px rgba(0,0,0,0.15); }
    .bulk-card img { height: 180px; object-fit: cover; filter: brightness(0.95); }
    .bulk-card .card-body { background: linear-gradient(135deg, #fff8e1, #fff3e0); }
  </style>
</head>

<body>

<nav class="navbar navbar-expand-lg fixed-top">
  <div class="container">
    <a class="navbar-brand text-success fw-bold fs-3" href="#">Meal <span class="text-danger">Bridge</span></a>
  </div>
</nav>

<section class="container my-5 pt-5">

  <h4 class="mb-4 fw-bold text-warning">Bulk Food Rescue</h4>

  <div class="alert alert-warning d-flex align-items-center">
    <i class="bi bi-truck me-2"></i>
    <div><strong>Bulk Food Rescue:</strong> For temples, weddings, events.</div>
  </div>

  <div class="row g-4">

    <div class="col-md-6 col-lg-4">
      <div class="card bulk-card h-100 shadow-sm">
        <img src="bulk3.jpg" class="card-img-top">
        <div class="card-body d-flex flex-column p-3">
          <h5><span class="badge bg-warning text-dark">BULK</span><br>Wedding Food Donation</h5>
          <p class="text-muted small">
            <i class="bi bi-geo-alt"></i> Ahmedabad<br>
            Expires: Today 11 PM
          </p>
          <div class="mt-auto d-flex gap-2">
            <button class="btn btn-warning flex-fill">Coordinate</button>
            <button class="btn btn-outline-secondary flex-fill">View Details</button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-6 col-lg-4">
      <div class="card bulk-card h-100 shadow-sm">
        <img src="bulk.jpg" class="card-img-top">
        <div class="card-body d-flex flex-column p-3">
          <h5><span class="badge bg-warning text-dark">BULK</span><br>Temple Food Donation</h5>
          <p class="text-muted small">
            <i class="bi bi-geo-alt"></i> Ahmedabad<br>
            Expires: Today 11 PM
          </p>
          <div class="mt-auto d-flex gap-2">
            <button class="btn btn-warning flex-fill">Coordinate</button>
            <button class="btn btn-outline-secondary flex-fill">View Details</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
